services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/orchem-arena
    volumes:
      - .:/var/www/orchem-arena
    networks:
      - existing
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./public:/var/www/orchem-arena/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - existing
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:latest
    container_name: orchem-centrifugo
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - existing

networks:
  existing:
    external: true
    name: orchem-arena_default



